[project]
name = "macmini-dashboard"
version = "0.1.0"
description = "macmini arr-dashboard: Flask + vanilla-JS home-server landing page"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
# deploy/*.py is untouched ops tooling (install + rehearsal scripts), so it is
# excluded from lint/format. Provisional decision for tracker open-question #1.
exclude = ["deploy", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The page modules mirror HTML attribute for attribute; Alpine expressions in
# those attributes run past 100 columns, and wrapping them makes the diff against
# the old static page unreadable.
"dashboard/page/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repo root importable so tests can `from dashboard...` without an
# installed package or src layout.
pythonpath = ["."]
